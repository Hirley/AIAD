apiVersion: 1

providers:
  - name: aiad
    orgId: 1
    folder: AIAD
    type: file
    disableDeletion: false
    # O arquivo é a fonte da verdade: editar pela interface é permitido para
    # experimentar, mas o que vale é o que está no repositório.
    allowUiUpdates: false
    updateIntervalSeconds: 15
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
