AllCops:
  NewCops: enable
  TargetRubyVersion: 3.1

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "features/**/*"

# Passos do Cucumber usam nomes em portugues (Dado/Quando/Entao) de proposito,
# para casar com o Gherkin em pt escrito nas features.
Naming/AsciiIdentifiers:
  Exclude:
    - "features/step_definitions/**/*"

# As classes recebem os colaboradores por argumento nomeado (injecao de
# dependencia), entao a contagem de argumentos nomeados nao mede complexidade
# aqui: EtlPipeline recebe qdrant, embedder, chunker, ingestor, cleaner e
# lexical_index, cada um substituivel em teste.
Metrics/ParameterLists:
  CountKeywordArgs: false

Lint/EmptyFile:
  Exclude:
    - "features/support/env.rb"

# Rack::Test chama `app` como metodo no World do Cucumber; nao da para trocar
# por attr_reader num arquivo de step definitions.
Style/TrivialAccessors:
  Exclude:
    - "features/step_definitions/**/*"
