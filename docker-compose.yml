services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    volumes:
      - qdrant_storage:/qdrant/storage
    # Sem portas publicadas: o Qdrant fica acessível só na rede interna do
    # compose. Quem fala com o mundo é a API, que exige chave.
    expose:
      - "6333"

  api:
    build: .
    # Nomeia a imagem que o compose constrói, em vez de deixar o nome derivado
    # do diretório do projeto. Assim `docker compose up --build` e
    # `docker build -t aiad:latest .` produzem a mesma tag, e o que se testa
    # aqui é o que iria para um registry.
    image: aiad:latest
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      AIAD_API_KEYS: ${AIAD_API_KEYS:?defina AIAD_API_KEYS no .env antes de subir}
      AIAD_COLLECTION: ${AIAD_COLLECTION:-documentos}
      AIAD_TOP_K: ${AIAD_TOP_K:-4}
      # Opcionais: sem a chave, o /ask responde de forma extrativa e o /agent
      # devolve 503 dizendo o que configurar. Vazio conta como ausente.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AIAD_MODEL: ${AIAD_MODEL:-}
      AIAD_HISTORY_BUDGET: ${AIAD_HISTORY_BUDGET:-400}
      AIAD_MAX_SESSIONS: ${AIAD_MAX_SESSIONS:-500}
      # Rastreamento no Langfuse, também opcional: sem o par de chaves o trace
      # vai só para o Prometheus e a API sobe igual. Observabilidade externa
      # não é requisito de boot.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_URL: ${LANGFUSE_URL:-}
    ports:
      - "127.0.0.1:9292:9292"

  # Roda a suíte (Rubocop, RSpec e Cucumber) dentro do container, porque não há
  # Ruby na máquina de desenvolvimento. Fica atrás de um profile para não subir
  # junto com a API. O código entra por bind mount e as gems ficam num volume,
  # então editar e rodar de novo não reinstala nada nem exige rebuild.
  test:
    profiles:
      - test
    build:
      context: .
      target: test
    volumes:
      - .:/app
      - test_bundle:/usr/local/bundle

  # A stack de observabilidade fica atrás de um profile porque custa memória e
  # não é preciso tê-la de pé para trabalhar na API. Suba com:
  #
  #     docker compose --profile observabilidade up -d
  #
  # As variáveis daqui usam `:-` e são conferidas no boot de cada serviço, e não
  # `:?` na interpolação. O motivo é concreto: o compose interpola o arquivo
  # **inteiro** antes de filtrar por profile, então um `:?` aqui derruba até o
  # `docker compose up` de quem nunca vai subir a stack. A obrigatoriedade
  # continua existindo — só migrou para o lugar onde ela é de fato necessária.
  prometheus:
    profiles:
      - observabilidade
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    depends_on:
      - api
    environment:
      AIAD_METRICS_TOKEN: ${AIAD_METRICS_TOKEN:-}
    # A chave chega por ambiente e vira arquivo no boot: a configuração do
    # Prometheus não expande variável de ambiente, e chave escrita no
    # prometheus.yml seria chave versionada.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$AIAD_METRICS_TOKEN" ]; then
          echo "defina AIAD_METRICS_TOKEN no .env com a chave de escopo metrics" >&2
          exit 1
        fi
        printf '%s' "$$AIAD_METRICS_TOKEN" > /tmp/metrics-token
        exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"

  loki:
    profiles:
      - observabilidade
    image: grafana/loki:2.9.10
    restart: unless-stopped
    volumes:
      - loki_data:/loki
    expose:
      - "3100"

  promtail:
    profiles:
      - observabilidade
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    depends_on:
      - loki
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ./observability/promtail.yml:/etc/promtail/promtail.yml:ro
      # Só leitura, e só o socket: o Promtail precisa dele para descobrir os
      # containers e ler o log de cada um. É um privilégio grande — quem lê o
      # socket do Docker manda no Docker —, aceitável numa stack local e que
      # num deploy real seria trocado por um agente sem esse acesso.
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    profiles:
      - observabilidade
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-}
      # Sem telemetria e sem checar atualização: a stack roda offline.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    # Senha vazia é recusada no boot em vez de virar o `admin` padrão do
    # Grafana: senha padrão que ninguém escolheu é a que ninguém troca.
    entrypoint:
      - /bin/sh
      - -c
      - |
        if [ -z "$$GF_SECURITY_ADMIN_PASSWORD" ]; then
          echo "defina GRAFANA_PASSWORD no .env antes de subir" >&2
          exit 1
        fi
        exec /run.sh
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  qdrant_storage:
  test_bundle:
  prometheus_data:
  loki_data:
  grafana_data:
