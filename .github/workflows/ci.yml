name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop
      - name: RSpec
        run: bundle exec rspec
      - name: Cucumber
        run: bundle exec cucumber

  docker:
    runs-on: ubuntu-latest
    # No nível do job: o compose interpola o arquivo em todo comando, inclusive
    # no down, então a variável precisa existir até no teardown.
    env:
      AIAD_API_KEYS: leitor:chave-de-ci-leitura:read;ingestor:chave-de-ci-total:read,write;prometheus:chave-de-ci-metricas:metrics
    steps:
      - uses: actions/checkout@v4

      - name: Sobe a stack (API + Qdrant)
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Health check responde sem credencial
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/health)" = "200"

      - name: Rota protegida recusa quem não tem chave
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9292/search)" = "401"

      # O escopo próprio do /metrics precisa valer nas duas direções: sem chave
      # não passa, e chave de leitura de documento também não.
      - name: /metrics só responde a quem tem o escopo metrics
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/metrics)" = "401"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/metrics \
            -H 'Authorization: Bearer chave-de-ci-leitura')
          test "$status" = "403"

      - name: As métricas saem no formato do Prometheus
        run: |
          metricas=$(curl -sf http://127.0.0.1:9292/metrics -H 'Authorization: Bearer chave-de-ci-metricas')
          echo "$metricas" | grep -q '^# TYPE aiad_http_requests_total counter$'
          echo "$metricas" | grep -q '^aiad_process_cpu_seconds_total '
          echo "$metricas" | grep -q 'route="/health",status="200"'

      - name: O log da API sai em JSON, uma linha por requisição
        run: |
          linha=$(docker compose logs --no-log-prefix api | grep '"path":"/health"' | tail -1)
          echo "$linha"
          test "$(echo "$linha" | jq -r '.status')" = "200"
          test "$(echo "$linha" | jq -r '.route')" = "/health"

      - name: Chave de leitura não pode ingerir
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9292/documents \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"content":"texto","source":"a.txt"}')
          test "$status" = "403"

      - name: Ingestão e pergunta ponta a ponta contra o Qdrant real
        run: |
          curl -sf -X POST http://127.0.0.1:9292/documents \
            -H 'Authorization: Bearer chave-de-ci-total' -H 'Content-Type: application/json' \
            -d '{"content":"A política de férias garante trinta dias por ano.","source":"politica.txt"}'
          resposta=$(curl -sf -X POST http://127.0.0.1:9292/ask \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"question":"quantos dias de férias por ano"}')
          echo "$resposta"
          echo "$resposta" | grep -q 'politica.txt'

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derruba a stack
        if: always()
        run: docker compose down --volumes
