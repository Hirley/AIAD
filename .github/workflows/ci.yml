name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: .ruby-version
          bundler-cache: true
      - name: Rubocop
        run: bundle exec rubocop
      - name: RSpec
        run: bundle exec rspec
      - name: Cucumber
        run: bundle exec cucumber

  docker:
    runs-on: ubuntu-latest
    # No nível do job: o compose interpola o arquivo em todo comando, inclusive
    # no down, então a variável precisa existir até no teardown.
    env:
      AIAD_API_KEYS: leitor:chave-de-ci-leitura:read;ingestor:chave-de-ci-total:read,write;prometheus:chave-de-ci-metricas:metrics
    steps:
      - uses: actions/checkout@v4

      # Este job roda **sem** as variáveis da stack de observabilidade, de
      # propósito: é assim que se garante que quem só quer a API não precisa
      # configurar Grafana para subir. O compose interpola o arquivo inteiro
      # antes de filtrar por profile, então uma variável obrigatória num
      # serviço do profile derruba até quem nunca vai usá-lo — e foi
      # exatamente o que aconteceu aqui uma vez.
      - name: O arquivo do compose interpola sem a configuração do profile
        run: |
          docker compose config --quiet
          docker compose --profile observabilidade config --quiet

      - name: Sobe a stack (API + Qdrant)
        run: docker compose up --build --detach --wait --wait-timeout 180

      - name: Health check responde sem credencial
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/health)" = "200"

      # O console é o único artefato que não é Ruby, e a imagem é o único lugar
      # onde ele pode sumir: o RSpec lê a página do disco do repositório, onde
      # ela sempre está. Um `COPY public` esquecido já derruba o boot, e o
      # `--wait` acima falharia — mas por acidente, não por intenção. Aqui a
      # verificação é explícita, e cobre também o caso que o boot não pega:
      # página servida vazia, ou com o content-type errado.
      - name: O console é servido pela imagem, sem credencial
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/)" = "200"
          # Cabeçalho em arquivo, e não por pipe: `grep -q` sai no primeiro
          # casamento e mataria o curl antes de o corpo terminar de ser escrito,
          # deixando os greps seguintes intermitentes.
          curl -s -D cabecalho.txt -o pagina.html http://127.0.0.1:9292/
          grep -qi 'content-type: text/html' cabecalho.txt
          grep -q '<title>AIAD' pagina.html
          # A página pede a chave; se ela passar a carregar uma, o CI para aqui.
          grep -q 'type="password"' pagina.html
          ! grep -q 'chave-de-ci' pagina.html

      # O CI roda sem ANTHROPIC_API_KEY de propósito: nenhuma chave de modelo
      # entra aqui. O que se verifica é a degradação — a rota existe, exige
      # credencial e diz o que falta em vez de dar seis voltas no laço.
      - name: A rota do agente degrada explicando o que configurar
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9292/agent)" = "401"
          resposta=$(curl -s -X POST http://127.0.0.1:9292/agent \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"question":"quantos dias de férias"}')
          echo "$resposta"
          echo "$resposta" | grep -q 'ANTHROPIC_API_KEY'

      - name: Rota protegida recusa quem não tem chave
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9292/search)" = "401"

      # O escopo próprio do /metrics precisa valer nas duas direções: sem chave
      # não passa, e chave de leitura de documento também não.
      - name: /metrics só responde a quem tem o escopo metrics
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/metrics)" = "401"
          status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:9292/metrics \
            -H 'Authorization: Bearer chave-de-ci-leitura')
          test "$status" = "403"

      - name: As métricas saem no formato do Prometheus
        run: |
          metricas=$(curl -sf http://127.0.0.1:9292/metrics -H 'Authorization: Bearer chave-de-ci-metricas')
          echo "$metricas" | grep -q '^# TYPE aiad_http_requests_total counter$'
          echo "$metricas" | grep -q '^aiad_process_cpu_seconds_total '
          echo "$metricas" | grep -q 'route="/health",status="200"'

      - name: O log da API sai em JSON, uma linha por requisição
        run: |
          linha=$(docker compose logs --no-log-prefix api | grep '"path":"/health"' | tail -1)
          echo "$linha"
          test "$(echo "$linha" | jq -r '.status')" = "200"
          test "$(echo "$linha" | jq -r '.route')" = "/health"

      - name: Chave de leitura não pode ingerir
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:9292/documents \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"content":"texto","source":"a.txt"}')
          test "$status" = "403"

      - name: Ingestão e pergunta ponta a ponta contra o Qdrant real
        run: |
          curl -sf -X POST http://127.0.0.1:9292/documents \
            -H 'Authorization: Bearer chave-de-ci-total' -H 'Content-Type: application/json' \
            -d '{"content":"A política de férias garante trinta dias por ano.","source":"politica.txt"}'
          resposta=$(curl -sf -X POST http://127.0.0.1:9292/ask \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"question":"quantos dias de férias por ano"}')
          echo "$resposta"
          echo "$resposta" | grep -q 'politica.txt'

      # Regressão do bug em que a busca vetorial voltava sem payload. Só
      # aparece depois de reiniciar: enquanto o processo vive, o índice BM25 em
      # memória ainda tem o texto e a fusão RRF entrega a origem pelo braço
      # léxico. Reiniciada, a API depende só do Qdrant — e era aí que ela
      # respondia "não encontrei" para documento indexado.
      # Este passo existia e passava, e por muito tempo foi cego para metade do
      # que verificava: o Qdrant tem volume, então o braço **vetorial** da busca
      # sobrevivia ao restart e respondia sozinho. O índice léxico, que vive na
      # memória do processo, era apagado — e nada aqui notava.
      #
      # A checagem da métrica é o que enxerga isso. Zero com documento indexado
      # significa busca híbrida rodando com um braço só.
      - name: O documento indexado sobrevive ao restart da API
        run: |
          docker compose restart api
          docker compose up --detach --wait --wait-timeout 120 api
          resposta=$(curl -sf -X POST http://127.0.0.1:9292/ask \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"question":"quantos dias de férias por ano"}')
          echo "$resposta"
          echo "$resposta" | grep -q 'politica.txt'
          echo "$resposta" | grep -q 'trinta dias'

      - name: O índice léxico se reconstrói do acervo depois do restart
        run: |
          curl -sf -H 'Authorization: Bearer chave-de-ci-metricas' \
            http://127.0.0.1:9292/metrics > metricas.txt
          grep 'aiad_lexical_index_documents' metricas.txt
          trechos=$(grep -oP '^aiad_lexical_index_documents(\{[^}]*\})? \K[0-9.]+' metricas.txt)
          echo "trechos no indice lexico: $trechos"
          # Maior que zero: o documento ingerido antes do restart voltou para o
          # indice sem ninguem reingerir nada.
          test "$(printf '%.0f' "$trechos")" -gt 0

      # A inversão que vale para qualquer observador: ninguém aceita cair
      # porque quem estava olhando caiu. As chaves aqui são de mentira e a URL
      # aponta para uma porta fechada dentro do próprio container — nenhuma
      # credencial de Langfuse entra no CI, e o que se exercita é justamente o
      # caminho da recusa de conexão.
      - name: Langfuse inalcançável não derruba a resposta nem a métrica
        env:
          LANGFUSE_PUBLIC_KEY: pk-de-ci
          LANGFUSE_SECRET_KEY: sk-de-ci
          LANGFUSE_URL: http://127.0.0.1:1
        run: |
          docker compose up --detach --wait --wait-timeout 120 api
          resposta=$(curl -sf -X POST http://127.0.0.1:9292/ask \
            -H 'Authorization: Bearer chave-de-ci-leitura' -H 'Content-Type: application/json' \
            -d '{"question":"quantos dias de férias por ano"}')
          echo "$resposta"
          echo "$resposta" | grep -q 'politica.txt'
          metricas=$(curl -sf http://127.0.0.1:9292/metrics -H 'Authorization: Bearer chave-de-ci-metricas')
          echo "$metricas" | grep -qE '^aiad_llm_calls_total\{[^}]*\} [1-9]'

      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs

      - name: Derruba a stack
        if: always()
        run: docker compose down --volumes
